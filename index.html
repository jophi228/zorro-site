<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ к видео</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Введите пароль для доступа</h2>
    <input type="password" id="passwordInput" placeholder="Введите пароль">
    <button onclick="checkPassword()">Войти</button>
    <div class="error" id="errorMessage">Неверный пароль. Попробуйте еще раз.</div>
</div>

<script>
    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        const errorDiv = document.getElementById('errorMessage');

        // Пароли и соответствующие им ссылки
        const password1 = "zorroE39QWERTY 666 PERDOSJOK";
        const url1 = "https://www.dropbox.com/scl/fi/8qh05pngdpkze9phf1ik9/Video_Part_1.mp4?rlkey=099afcsqnifvfytxycugxhgub&st=n73me8g4&dl=1";

        const password2 = "???";
        const url2 = "https://www.dropbox.com/scl/fi/e32eo8l3wsbjglkxzp743/Video_Part_2.mp4?rlkey=azbmw9nvwhcroelod0y5wepua&st=et30r32c&dl=1";

        if (input === password1) {
            errorDiv.style.display = 'none';
            window.location.href = url1;
        } else if (input === password2) {
            errorDiv.style.display = 'none';
            window.location.href = url2;
        } else {
            errorDiv.style.display = 'block';
        }
    }
</script>

</body>
</html>
